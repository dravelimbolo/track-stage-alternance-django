[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "*/migrations/*",
    ".venv",
    "staticfiles",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
  migrations
  | .venv
  | staticfiles
)/
'''